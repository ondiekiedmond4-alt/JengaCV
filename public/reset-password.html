<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — JengaCV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1c2333; --paper:#faf8f4; --green:#1f6f5c; --green-dark:#164f42; --line:#e2ddd0; --danger:#a4383a; --muted:#6b6f7a; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(28,35,51,.12);}
  h1{font-family:'Fraunces',serif;font-size:22px;margin:0 0 6px;text-align:center;}
  p.sub{color:var(--muted);font-size:13.5px;text-align:center;margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;}
  input[type=password]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;}
  input:focus{outline:none;border-color:var(--green);}
  .btn{width:100%;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;margin-top:6px;}
  .btn:hover{background:var(--green-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:13px;border-radius:8px;padding:10px 12px;margin-top:14px;}
  .msg.error{background:#fbeceb;color:var(--danger);}
  .msg.success{background:#eaf3f0;color:var(--green-dark);}
  .msg:empty{display:none;}
  a.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--green);text-decoration:none;}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Choose a new password for your JengaCV account.</p>

    <div id="formArea">
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your new password">
      </div>
      <button class="btn" id="submitBtn">Update password</button>
      <div class="msg" id="msg"></div>
    </div>

    <a class="back" href="/app">Back to JengaCV</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const msgBox = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  if (!token) {
    document.getElementById('subText').textContent = 'This reset link is missing its token.';
    document.getElementById('formArea').innerHTML = `<div class="msg error">This link looks incomplete. Please request a new password reset from the login screen.</div>`;
  }

  btn?.addEventListener('click', async () => {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    msgBox.className = 'msg';
    msgBox.textContent = '';

    if (!newPassword || newPassword.length < 6) {
      msgBox.className = 'msg error';
      msgBox.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (newPassword !== confirmPassword) {
      msgBox.className = 'msg error';
      msgBox.textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Updating…`;

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) {
        msgBox.className = 'msg error';
        msgBox.textContent = data.error || 'Could not reset your password. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Update password';
        return;
      }
      document.getElementById('formArea').innerHTML = `<div class="msg success">Your password has been updated. You can now log in with your new password.</div>`;
    } catch (err) {
      msgBox.className = 'msg error';
      msgBox.textContent = 'Network error — please check your connection and try again.';
      btn.disabled = false;
      btn.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
